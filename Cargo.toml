[package]
name = "tfs-ssh"
version = "0.4.0"
edition = "2021"
description = "tfs — fare öncelikli SSH dosya tarayıcısı (F2) + modern SSH terminali (F1) + F4 ile uzak dosyayı fresh editöründe düzenleme. Tek bağlantı, tek araç."
authors = ["Okan Aytimur"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/okanaytimur/tfs"
readme = "README.md"
keywords = ["ssh", "sftp", "terminal", "tui", "file-transfer"]
categories = ["command-line-utilities", "network-programming"]
# PLAN.md oturumlar arası iç çalışma notu (33 KB) — depoda kalsın ama crates.io
# paketine girmesin; paketin neredeyse yarısıydı ve kullanıcıya hitap etmiyor.
exclude = ["PLAN.md"]

# `cargo binstall tfs-ssh` — derlemeden, GitHub Releases'ten hazır binary indirir.
# Bu bölüm crates.io'ya yüklenen sürümden okunur, GitHub'daki Cargo.toml'dan
# DEĞİL: yayınlanmış bir sürüme sonradan eklenemez, yeni sürüm gerekir.
# binstall'ın varsayılan isim kalıpları Rust hedef üçlüsü bekler
# (`tfs-ssh-x86_64-pc-windows-msvc-v0.4.0.exe`); bizim asset adlarımız farklı,
# o yüzden hedef başına açıkça yazılıyor. Yeni sürümde asset adlarını aynı
# kalıpta tut (`tfs-v<sürüm>-<platform>`), burası kendiliğinden uyar.
[package.metadata.binstall]
pkg-fmt = "bin"                  # arşiv değil, çıplak binary
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/tfs-v{ version }-windows-x86_64.exe"

[package.metadata.binstall.overrides.i686-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/tfs-v{ version }-windows-i686.exe"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/tfs-v{ version }-linux-x86_64"

# crates.io paket adı `tfs-ssh` (`tfs` alınmış), ama kurulan komut `tfs`.
[[bin]]
name = "tfs"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
russh = { version = "0.62", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "2.3"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# tui-term 0.3+ vt100 0.16.2'ye (unicode-width 0.2.1) bağlı; bu ratatui 0.29'un
# unicode-width =0.2.0 sabiti ile çakışıyor. 0.2.0 + vt100 0.15 (unicode-width
# 0.1) ise yan yana derleniyor — bu yüzden sabitlendi.
tui-term = "=0.2.0"
vt100 = "=0.15.2"
# Panoya kopyalama (çapraz-platform). image-data özelliği ağır `image` crate'ini
# çektiği için kapalı; sadece metin panosu gerekiyor. wayland-data-control Linux
# Wayland desteği içindir (Windows'ta unix-gated olduğu için etkisiz).
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }

[dev-dependencies]
# `test-util` (sanal zaman / start_paused) `full` içinde yok; yapıştırma yığını
# testleri zamanlayıcıyı gerçek zamanda beklemeden ilerletmek için kullanıyor.
tokio = { version = "1", features = ["test-util"] }
