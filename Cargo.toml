[package]
name = "tfs-ssh"
version = "0.1.0"
edition = "2021"
description = "tfs — fare öncelikli SSH dosya tarayıcısı (F2) + modern SSH terminali (F1). Tek bağlantı, iki mod."
authors = ["Okan Aytimur"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/okanaytimur/tfs"
readme = "README.md"
keywords = ["ssh", "sftp", "terminal", "tui", "file-transfer"]
categories = ["command-line-utilities", "network-programming"]

# crates.io paket adı `tfs-ssh` (`tfs` alınmış), ama kurulan komut `tfs`.
[[bin]]
name = "tfs"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
russh = { version = "0.62", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "2.3"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# tui-term 0.3+ vt100 0.16.2'ye (unicode-width 0.2.1) bağlı; bu ratatui 0.29'un
# unicode-width =0.2.0 sabiti ile çakışıyor. 0.2.0 + vt100 0.15 (unicode-width
# 0.1) ise yan yana derleniyor — bu yüzden sabitlendi.
tui-term = "=0.2.0"
vt100 = "=0.15.2"
